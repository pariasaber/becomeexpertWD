<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Image Filter App</h1>
        <div class="settings">
            <label><input type="checkbox" id="blurToggle"> Blur</label>
            <label><input type="checkbox" id="grayscaleToggle"> Grayscale</label>
            <label>Width: <input type="number" id="widthInput" disabled></label>
            <label>Height: <input type="number" id="heightInput" disabled></label>
            <button id="toggleSize">Set Size</button>
            <label>Number of images to load: <input type="number" id="imagesToLoad" value="5"></label>
            <label>Images per load: <input type="number" id="imagesPerLoad" value="3"></label>
            <button id="loadImages">Load Images</button>
        </div>
        <div class="image-gallery" id="imageGallery"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
